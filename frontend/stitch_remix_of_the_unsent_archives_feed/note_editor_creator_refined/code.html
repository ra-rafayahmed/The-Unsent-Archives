<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Editor | The Unsent Archives</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,600&amp;family=Work+Sans:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-tint": "#a83900",
              primary: "#FF6B2B",
              error: "#ba1a1a",
              "on-surface": "#1c1c1a",
              "on-primary": "#ffffff",
              outline: "#8d7167",
              "surface-bright": "#fcf9f5",
              secondary: "#615e57",
              background: "#F5EFE6",
              "surface-container": "#f0edea",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            fontFamily: {
              "display-serif": ["Newsreader"],
              "label-caps": ["Work Sans"],
              "ui-button": ["Work Sans"],
              "quote-text": ["Newsreader"],
              "headline-md": ["Newsreader"],
              "body-md": ["Work Sans"],
            },
            fontSize: {
              "display-serif": [
                "48px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "600" },
              ],
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.08em", fontWeight: "600" },
              ],
              "ui-button": [
                "14px",
                { lineHeight: "1", letterSpacing: "0.01em", fontWeight: "500" },
              ],
              "quote-text": ["24px", { lineHeight: "1.6", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "500" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        vertical-align: middle;
      }
      .blinking-cursor {
        border-right: 2px solid #ff6b2b;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: #ff6b2b;
        }
      }
      .editorial-shadow {
        box-shadow: 0px 8px 30px rgba(26, 26, 24, 0.08);
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-[#F5EFE6] text-on-surface font-body-md min-h-screen flex flex-col">
    <!-- TopAppBar -->
    <nav
      class="bg-[#F5EFE6] border-b border-stone-200 sticky top-0 z-50 flex justify-between items-center px-6 py-4 w-full"
    >
      <div class="flex items-center gap-4">
        <button class="text-primary hover:opacity-80 transition-opacity flex items-center">
          <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <span class="text-2xl font-display-serif italic font-bold text-primary"
          >The Unsent Archives</span
        >
      </div>
      <div class="flex items-center gap-8">
        <button
          class="text-stone-500 font-medium hover:text-primary transition-colors duration-200 font-ui-button text-ui-button"
        >
          Save Draft
        </button>
        <button
          class="bg-primary text-white px-6 py-2.5 rounded-full font-ui-button text-ui-button shadow-sm hover:opacity-90 active:scale-95 transition-all"
        >
          Publish
        </button>
      </div>
    </nav>
    <main class="flex-1 flex overflow-hidden">
      <!-- Left Panel: Settings (35%) -->
      <aside
        class="w-[35%] bg-white border-r border-stone-200 overflow-y-auto hide-scrollbar h-[calc(100vh-73px)]"
      >
        <div class="p-8 flex flex-col gap-8">
          <div>
            <h2 class="font-headline-md text-headline-md text-stone-900 mb-2">Editor Settings</h2>
            <p class="font-body-md text-stone-500">Craft your ephemera</p>
          </div>
          <!-- Font Style: 2x2 Grid -->
          <div class="flex flex-col gap-3">
            <label class="font-label-caps text-[10px] text-stone-400 uppercase tracking-widest"
              >Typography</label
            >
            <div class="grid grid-cols-2 gap-2">
              <button
                class="py-3 px-4 rounded-lg bg-stone-900 text-white font-medium flex items-center justify-center gap-2"
              >
                <span class="font-display-serif">Serif</span>
              </button>
              <button
                class="py-3 px-4 rounded-lg border border-stone-200 text-stone-600 hover:bg-stone-50 transition-colors font-medium flex items-center justify-center gap-2"
              >
                <span class="italic">Handwritten</span>
              </button>
              <button
                class="py-3 px-4 rounded-lg border border-stone-200 text-stone-600 hover:bg-stone-50 transition-colors font-medium flex items-center justify-center gap-2"
              >
                <span class="font-mono text-sm">Typewriter</span>
              </button>
              <button
                class="py-3 px-4 rounded-lg border border-stone-200 text-stone-600 hover:bg-stone-50 transition-colors font-medium flex items-center justify-center gap-2"
              >
                <span>Minimal</span>
              </button>
            </div>
          </div>
          <!-- Canvas / Background: 5 Swatches -->
          <div class="flex flex-col gap-3">
            <label class="font-label-caps text-[10px] text-stone-400 uppercase tracking-widest"
              >Canvas</label
            >
            <div class="flex gap-3 mb-2">
              <button
                class="w-10 h-10 rounded-full ring-2 ring-primary ring-offset-2 bg-[#F5EFE6]"
              ></button>
              <button class="w-10 h-10 rounded-full border border-stone-200 bg-white"></button>
              <button class="w-10 h-10 rounded-full border border-stone-200 bg-stone-100"></button>
              <button class="w-10 h-10 rounded-full border border-stone-200 bg-[#EAE2D5]"></button>
              <button class="w-10 h-10 rounded-full border border-stone-200 bg-stone-900"></button>
            </div>
            <div
              class="border-2 border-dashed border-stone-200 rounded-xl p-6 text-center cursor-pointer hover:border-stone-300 transition-colors group"
            >
              <span
                class="material-symbols-outlined text-stone-300 text-3xl mb-1 group-hover:text-stone-400 transition-colors"
                data-icon="image"
                >image</span
              >
              <p class="text-stone-400 text-sm">Upload custom texture</p>
              <button class="text-primary text-xs font-medium mt-1 hover:underline">
                or choose from gallery
              </button>
            </div>
          </div>
          <!-- Ambiance / Music: ♪ Icon -->
          <div class="flex flex-col gap-3">
            <label class="font-label-caps text-[10px] text-stone-400 uppercase tracking-widest"
              >Ambiance</label
            >
            <div class="relative group">
              <div class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold">♪</div>
              <input
                class="w-full pl-10 pr-10 py-4 bg-stone-50 rounded-xl border border-stone-200 font-medium text-stone-800 cursor-pointer focus:ring-0 focus:border-stone-300"
                readonly=""
                type="text"
                value="Claire de Lune"
              />
              <span
                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-stone-300 group-hover:text-stone-500"
                data-icon="chevron_right"
                >chevron_right</span
              >
            </div>
          </div>
          <!-- Visibility: 3 Options -->
          <div class="flex flex-col gap-3">
            <label class="font-label-caps text-[10px] text-stone-400 uppercase tracking-widest"
              >Visibility</label
            >
            <div class="bg-stone-50 p-1 rounded-full flex gap-1 border border-stone-200">
              <button
                class="flex-1 py-2 px-3 rounded-full bg-white shadow-sm text-primary font-medium text-sm flex items-center justify-center gap-1.5"
              >
                <span class="material-symbols-outlined text-[16px]" data-icon="public">public</span>
                Public
              </button>
              <button
                class="flex-1 py-2 px-3 rounded-full text-stone-500 hover:text-stone-700 font-medium text-sm flex items-center justify-center gap-1.5"
              >
                <span class="material-symbols-outlined text-[16px]" data-icon="person_off"
                  >person_off</span
                >
                Anonymous
              </button>
              <button
                class="flex-1 py-2 px-3 rounded-full text-stone-500 hover:text-stone-700 font-medium text-sm flex items-center justify-center gap-1.5"
              >
                <span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
                Private
              </button>
            </div>
          </div>
          <!-- Metadata / Tags: Orange Pills -->
          <div class="flex flex-col gap-3">
            <label class="font-label-caps text-[10px] text-stone-400 uppercase tracking-widest"
              >Metadata</label
            >
            <div class="flex flex-wrap gap-2">
              <span
                class="px-3 py-1 bg-[#FF6B2B]/10 text-primary rounded-full text-xs font-label-caps border border-primary/20"
                >#unsent</span
              >
              <span
                class="px-3 py-1 bg-[#FF6B2B]/10 text-primary rounded-full text-xs font-label-caps border border-primary/20"
                >#3am</span
              >
              <span
                class="px-3 py-1 bg-[#FF6B2B]/10 text-primary rounded-full text-xs font-label-caps border border-primary/20"
                >#letters</span
              >
              <button
                class="px-3 py-1 border border-dashed border-stone-300 text-stone-400 rounded-full text-xs font-label-caps flex items-center gap-1 hover:border-stone-400 hover:text-stone-500 transition-colors"
              >
                <span class="material-symbols-outlined text-[14px]" data-icon="add">add</span> Tag
              </button>
            </div>
          </div>
          <div class="mt-auto pt-8 border-t border-stone-100">
            <button
              class="w-full text-stone-400 text-xs font-medium hover:text-stone-600 transition-colors flex items-center justify-center gap-2"
            >
              <span class="material-symbols-outlined text-[16px]" data-icon="refresh">refresh</span>
              Reset All Settings
            </button>
          </div>
        </div>
      </aside>
      <!-- Right Panel: Canvas (65%) -->
      <section class="flex-1 flex flex-col items-center justify-between py-12 px-8 overflow-y-auto">
        <div class="w-full flex flex-col items-center gap-12">
          <!-- Main Editor Card -->
          <div
            class="w-full max-w-[560px] bg-white rounded-[24px] editorial-shadow overflow-hidden flex flex-col"
          >
            <!-- Header Image (Top 40%) -->
            <div class="h-[240px] relative">
              <img
                alt="warm golden bokeh light leaks"
                class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt22G27L_DPOfb5gOH6Z3k6ijH5XeQK9LYh__cVlPh4oAQth6ji_FLTv52qpa9dHpsfjV16KinU-ee-PpyPBgmaOvcuX2Y0kF8i3ntgft_dskqnY5AEmmv-YLm5ZHKz0uNEAYeTcFSjp3D64I2VkCEnvNIhxmJLipp0IHiofukgdTupARR8iubl08RvHYm4cQ4itlhNQjERJXL7cLPrXJ97P9HlgeykCjLrECH_E6YRtZuUYOTGiwzO855HEqmWzb4REaHz7q5XNc"
              />
              <div class="absolute inset-0 bg-black/10 flex items-center justify-center">
                <button
                  class="bg-white/90 backdrop-blur-md text-stone-800 px-5 py-2.5 rounded-full text-sm font-ui-button flex items-center gap-2 hover:bg-white transition-all shadow-sm"
                >
                  <span class="material-symbols-outlined text-sm" data-icon="photo_camera"
                    >photo_camera</span
                  >
                  Change Image
                </button>
              </div>
            </div>
            <!-- Text Area -->
            <div class="p-12 flex flex-col min-h-[320px]">
              <div class="flex-1">
                <p
                  class="font-quote-text text-quote-text text-stone-800 leading-relaxed font-display-serif"
                >
                  some days the words come easy. other days—<span
                    class="blinking-cursor ml-1"
                  ></span>
                </p>
              </div>
              <!-- Card Footer -->
              <div class="mt-12 flex items-center justify-between border-t border-stone-50 pt-8">
                <div class="flex items-center gap-3">
                  <img
                    alt="user"
                    class="w-8 h-8 rounded-full bg-stone-200"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2PxwNjWYVpyXNj5EmkMSt5-uNbIK7MDGHMvR50Ncf0fm8bp5-yVaN4x8cCL7gF2508Ay8cSEuGi0oEGVex-BaTAFxkEryZmHNtBCt7S2nUKdnR1O6d9D9TJqjgfqMIIQ1egiTt5KpBWErnKTgbZudVxVq1lenFfTlQfNSrnDHtqD8Auy9r-Q7jPsMDsHlLviaYf2NSOrkbAk09HIHraUmBlcy2wShv6SF5QJ3ctb5WQ6jbGF0GLbWYCfVCs_FX0F_qVGG6oHa7v4"
                  />
                  <span class="font-label-caps text-[10px] text-stone-500">@your_username</span>
                </div>
                <div class="flex items-center gap-5 text-stone-300">
                  <span
                    class="material-symbols-outlined hover:text-primary cursor-pointer transition-colors"
                    data-icon="favorite"
                    >favorite</span
                  >
                  <span
                    class="material-symbols-outlined hover:text-primary cursor-pointer transition-colors"
                    data-icon="bookmark"
                    >bookmark</span
                  >
                  <div class="ml-2 pl-5 border-l border-stone-100 flex items-center">
                    <span class="font-label-caps text-[10px] text-primary/60">47 / 500</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- Editor Toggle Tabs -->
          <div class="bg-stone-200/40 p-1 rounded-full flex w-fit border border-stone-200/50">
            <button
              class="px-8 py-2.5 rounded-full bg-white shadow-sm text-stone-900 font-semibold text-sm"
            >
              Editing
            </button>
            <button
              class="px-8 py-2.5 rounded-full text-stone-500 font-medium text-sm hover:text-stone-700 transition-colors"
            >
              Preview
            </button>
          </div>
        </div>
        <!-- Live Preview Strip (Bottom) -->
        <div
          class="w-full max-w-[560px] flex flex-col gap-4 mt-12 opacity-70 group hover:opacity-100 transition-opacity duration-300"
        >
          <div class="flex items-center gap-4">
            <div class="h-px flex-1 bg-stone-200"></div>
            <span
              class="font-label-caps text-[9px] text-stone-400 uppercase tracking-[0.2em] font-bold"
              >How it appears in the feed</span
            >
            <div class="h-px flex-1 bg-stone-200"></div>
          </div>
          <div class="flex justify-center scale-[0.4] origin-top h-32 overflow-hidden">
            <div
              class="w-full max-w-[560px] bg-white rounded-[24px] shadow-lg overflow-hidden flex flex-col pointer-events-none border border-stone-100"
            >
              <div class="h-32 relative">
                <img
                  alt="bokeh"
                  class="w-full h-full object-cover"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt22G27L_DPOfb5gOH6Z3k6ijH5XeQK9LYh__cVlPh4oAQth6ji_FLTv52qpa9dHpsfjV16KinU-ee-PpyPBgmaOvcuX2Y0kF8i3ntgft_dskqnY5AEmmv-YLm5ZHKz0uNEAYeTcFSjp3D64I2VkCEnvNIhxmJLipp0IHiofukgdTupARR8iubl08RvHYm4cQ4itlhNQjERJXL7cLPrXJ97P9HlgeykCjLrECH_E6YRtZuUYOTGiwzO855HEqmWzb4REaHz7q5XNc"
                />
              </div>
              <div class="p-10 flex flex-col">
                <p class="font-display-serif text-2xl text-stone-800">
                  some days the words come easy...
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- Postmark Speciality Component -->
    <div class="fixed bottom-8 right-8 pointer-events-none z-50">
      <div
        class="w-20 h-20 rounded-full border border-stone-300/60 flex flex-col items-center justify-center text-[9px] font-label-caps text-stone-400 rotate-12 bg-white/40 backdrop-blur-sm"
      >
        <span class="font-bold">24 OCT</span>
        <div class="w-10 h-px bg-stone-200/80 my-1"></div>
        <span class="font-bold tracking-tighter">STHLM</span>
      </div>
    </div>
  </body>
</html>
