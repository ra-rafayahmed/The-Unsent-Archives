# One-command local stack: MongoDB + API + web.
#   docker compose up --build
# Web:  http://localhost:8080      API: http://localhost:5000/api/health
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      # Defaults to the bundled mongo service; override in .env to use Atlas.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/unsent_archives}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
