name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB binary for mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          CI: true

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker · compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then echo; echo "API healthy"; ok=1; break; fi
            sleep 2
          done
          docker compose logs api
          docker compose down -v
          test "$ok" = 1
