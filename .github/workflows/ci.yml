name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache MongoDB binary for mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      # npm workspaces: one install at the root covers both packages.
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm audit --audit-level=high
      - run: npm run lint --workspace backend
      - run: npm run format:check --workspace backend
      # Fails the build below the coverageThreshold in backend/jest.config.js
      # (statements 84 / branches 71 / functions 80 / lines 86).
      - name: Tests + coverage gate
        run: npm run test:coverage --workspace backend
        env:
          CI: true
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm audit --audit-level=high
      - run: npm run lint --workspace frontend
      - run: npm run format:check --workspace frontend
      # Fails the build below coverage.thresholds in frontend/vite.config.js
      # (statements 85 / branches 79 / functions 80 / lines 86).
      - name: Tests + coverage gate
        run: npm run test:coverage --workspace frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
      - run: npm run build --workspace frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  clean-clone:
    name: Clean clone · npm ci && npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No cache and no per-package steps: this job proves the documented
      # two-command flow works on a machine that has never seen the project.
      - run: npm ci
      - run: npm test

  docker:
    name: Docker · compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then echo; echo "API healthy"; ok=1; break; fi
            sleep 2
          done
          docker compose logs api
          docker compose down -v
          test "$ok" = 1
