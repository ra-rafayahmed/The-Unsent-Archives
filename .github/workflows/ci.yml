name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache MongoDB binary for mongodb-memory-server
        uses: actions/cache@v6
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      # npm workspaces: one install at the root covers both packages.
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm audit --audit-level=high
      # Root-level files (README, compose, workflows) live outside both
      # workspaces and were previously never format-checked.
      - name: Prettier (root-level files)
        run: npx prettier --check "*.{json,md,yml,yaml}" ".github/**/*.{yml,yaml}"
      - run: npm run lint --workspace backend
      - run: npm run format:check --workspace backend
      # JSDoc-based checking: files opt in with `// @ts-check`, so the gate can
      # ratchet outward without a big-bang TypeScript migration.
      - run: npm run typecheck --workspace backend
      # Fails the build below the coverageThreshold in backend/jest.config.js
      # (statements 84 / branches 71 / functions 80 / lines 86).
      - name: Tests + coverage gate
        run: npm run test:coverage --workspace backend
        env:
          CI: true
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm audit --audit-level=high
      - run: npm run lint --workspace frontend
      - run: npm run format:check --workspace frontend
      # Same opt-in `// @ts-check` ratchet as the backend.
      - run: npm run typecheck --workspace frontend
      # Fails the build below coverage.thresholds in frontend/vite.config.js
      # (statements 85 / branches 79 / functions 80 / lines 86).
      - name: Tests + coverage gate
        run: |
          set -o pipefail
          npm run test:coverage --workspace frontend 2>&1 | tee /tmp/vitest.log
      # Annotations are readable without downloading the job log, which makes a
      # CI-only failure diagnosable from the commit page.
      - name: Surface the vitest tail on failure
        if: failure()
        run: |
          ERRS=$(grep -iE "error|cannot|failed|no test|worker|unhandled" /tmp/vitest.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=vitest failure detail::${ERRS}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
      - run: npm run build --workspace frontend
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  clean-clone:
    name: Clean clone · npm ci && npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No cache and no per-package steps: this job proves the documented
      # two-command flow works on a machine that has never seen the project.
      - run: npm ci
      - run: npm test

  docker:
    name: Docker · compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then echo; echo "API healthy"; ok=1; break; fi
            sleep 2
          done
          docker compose logs api
          docker compose down -v
          test "$ok" = 1

  # Release candidate: everything a maintainer needs to promote a green main
  # build by hand. Deliberately stops at a downloadable artifact + image —
  # there is no hosting target, so automating a deploy would be pretending.
  preview:
    name: Preview · build artifacts
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - name: Build the web bundle
        run: npm run build --workspace frontend
      - name: Report bundle sizes
        run: |
          echo "### Web bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h -d1 frontend/dist >> "$GITHUB_STEP_SUMMARY"
          ls -lhS frontend/dist/assets | head -n 10 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the deployable web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-${{ github.sha }}
          path: frontend/dist
          retention-days: 30
      - name: Build the API image and save it as an artifact
        run: |
          docker build -f backend/Dockerfile -t unsent-archives-api:${{ github.sha }} .
          docker save unsent-archives-api:${{ github.sha }} | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar.gz
          retention-days: 30
