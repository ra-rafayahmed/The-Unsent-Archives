version: 2
updates:
  # Single npm entry: this is an npm workspaces monorepo, so the root
  # package-lock.json covers backend/ and frontend/ alike.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    labels: [dependencies]
    groups:
      # One PR for all safe updates; majors stay separate so they can be
      # reviewed (and their breaking changes handled) one at a time.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies, docker]
